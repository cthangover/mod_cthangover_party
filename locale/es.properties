mod_cthangover_party_name = Cthangover: grupo inicial
mod_cthangover_party_desc = Crea el grupo inicial por defecto (Marao) y la habilidad slave_master cuando los recursos de los mods están listos, y lo restaura con NewGameStartedEvent. Separado de cthangover_game para que el mod de contenido base siga siendo solo contenido.
